name: Problem or suggestion for any tool
description: A bug, a content or citation error, or an idea, for any tool listed on Unclassified Tools.
title: "[Feedback] "
labels: [needs-review]
assignees: [benStrube]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve these unofficial study aids. Reports are public: don't include personal or sensitive information, and never paste anything that isn't approved for public release.
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options:
        - CFF Trainer
        - CFF Academy
        - Fires Pubs Library
        - Visual Library
        - Observed Fires Visual Reference
        - Promotion Visual Reference
        - Field Hygiene Visual Reference
        - Radio Visual Reference
        - Driver Program Visual Reference
        - Safety Program Visual Reference
        - Doctrine Primer Visual Reference
        - Squad Tactics Guide
        - Platoon Tactics Guide
        - Company Tactics Guide
        - Battalion Tactics Guide
        - Infantry Weapons Guide
        - Ranger School Prep
        - E3B Study Guide
        - Land Navigation Trainer
        - Marksmanship and Qualification
        - CLS Guide
        - Hand Receipt Guide
        - Tactical Convoy Guide
        - Tactical Radio Guide
        - PRT Leader Prep
        - BLC Prep
        - H2F Visual Reference
        - Training Management Planner
        - Leader Book Guide
        - Orders Guide
        - Counseling Visual Reference
        - NCOER Guide
        - Board Prep
        - Awards Guide
        - Uniform Visual Reference
        - PMCS Helper
        - Offline Package
        - Unclassified Tools (landing page)
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options: [Bug, Content or citation error, Suggestion, Other]
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Page, tab or section
      placeholder: e.g. Visual Reference, figure 5-3, or a link to the page
  - type: textarea
    id: what
    attributes:
      label: What happened, or what should change?
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Correct source (for content errors)
      placeholder: Publication and paragraph, e.g. ATP 3-09.30, para 4-12. Only publications approved for public release.
  - type: input
    id: browser
    attributes:
      label: Device and browser
